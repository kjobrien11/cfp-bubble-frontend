<div class="page">

  <div class="hero">
    <h1>🏆 CFP Bubble Game</h1>
    <p>
      Pick the smallest group of teams that contains
      the eventual CFP Champion.
    </p>
  </div>

  <div class="controls">

    <mat-form-field appearance="outline">
      <mat-label>Add a Team</mat-label>

      <input
        matInput
        placeholder="Search teams..."
        [formControl]="myControl"
        [matAutocomplete]="auto">

      <mat-autocomplete
        #auto="matAutocomplete"
        [displayWith]="displayTeam"
        (optionSelected)="onTeamSelected($event)">

        @for (team of filteredTeams | async; track team.espnId) {
          <mat-option [value]="team">
            {{team.schoolName}}
          </mat-option>
        }

      </mat-autocomplete>

    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput [(ngModel)]="name">
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input
        matInput
        type="email"
        [(ngModel)]="email">
    </mat-form-field>

    <button
      mat-icon-button
      color="warn"
      (click)="clear()">

      <mat-icon>delete</mat-icon>

    </button>

    <button
      mat-flat-button
      color="primary"
      (click)="submit()">

      <mat-icon>check</mat-icon>
      Submit Bubble

    </button>

  </div>

  <div class="bubble">
    @for (team of selectedTeams; track team.espnId) {

      <img
        class="logo"
        [src]="'https://a.espncdn.com/i/teamlogos/ncaa/500/' + team.espnId + '.png'"
        [alt]="team.schoolName">

    }

  </div>

  <div class="counter">

    {{selectedTeams.length}} Teams in your bubble

  </div>

</div>
